<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLUB BEE — ผึ้งน้อยรุมล้อม</title>
<meta name="description" content="Club Bee — Find Your Match. Join the Hive. แพลตฟอร์มหาคู่และคอมมูนิตี้ ไทย / English / 中文">
<meta name="theme-color" content="#D1005F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2B0418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Club Bee">
<meta property="og:title" content="CLUB BEE — ผึ้งน้อยรุมล้อม">
<meta property="og:description" content="Find Your Match. Join the Hive.">
<meta name="description" content="Club Bee — Find Your Match. Join the Hive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --honey:#D1005F; --gold:#FFC400; --gold-deep:#E69500; --gold-soft:#FFF0B3; --honey-deep:#9E0048; --honey-soft:#FFC2DC;
  --ink:#2B0418; --brown:#B07A00; --brown-soft:#E0A800;
  --cream:#FFEEF5; --white:#FFFFFF; --rose:#D7263D; --leaf:#3E8E5B; --sky:#3C7BD1;
  --bg:#FFEEF5; --surface:#FFFFFF; --surface-2:#FFDCEB; --text:#2B0418; --muted:#85405F;
  --line:#F7B8D3; --shadow:0 10px 30px rgba(158,0,72,.14);
  --r-lg:26px; --r-md:16px; --r-sm:10px;
  --font-d:"Mitr","IBM Plex Sans Thai","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-b:"IBM Plex Sans Thai","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F0510; --surface:#2E0A1C; --surface-2:#401029; --text:#FFF2F8; --muted:#F5B0CF;
    --line:#6A1A42; --shadow:0 10px 30px rgba(0,0,0,.45); --honey-soft:#6E0A3C; --honey-deep:#FFD23F;
  }
}
:root[data-theme="dark"]{
  --bg:#1F0510; --surface:#2E0A1C; --surface-2:#401029; --text:#FFF2F8; --muted:#F5B0CF;
  --line:#6A1A42; --shadow:0 10px 30px rgba(0,0,0,.45); --honey-soft:#6E0A3C; --honey-deep:#FFD23F;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:500;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.4rem)} h2{font-size:clamp(1.4rem,4vw,2rem)} h3{font-size:1.2rem}
p{margin:0 0 .8em} a{color:var(--honey-deep)}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.row{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1} .between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
.hidden{display:none!important}
.container{max-width:1080px;margin:0 auto;padding:0 20px}

/* Buttons */
.btn{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:12px 22px;font-family:var(--font-d);font-weight:500;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn-honey{background:linear-gradient(135deg,#F0247F,var(--honey) 55%,var(--honey-deep));color:#FFFFFF;box-shadow:0 6px 18px rgba(209,0,95,.35)}
.btn-honey:hover{background:linear-gradient(135deg,#E8157A,#B00052);box-shadow:0 6px 22px rgba(255,196,0,.45)}
.btn-ink{background:var(--ink);color:#FFF2F8}
:root[data-theme="dark"] .btn-ink{background:#FFF2F8;color:#2B0418}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn-danger{background:var(--rose);color:#fff}
.btn-sm{padding:7px 14px;font-size:.88rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{appearance:none;border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;font-size:1.1rem;position:relative}
.badge-dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--rose);color:#fff;font-size:.65rem;display:grid;place-items:center;padding:0 4px}

/* Forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-size:1rem}
.inp:focus{border-color:var(--honey);outline:none}
textarea.inp{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--honey-deep);flex:none;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--honey);border-color:var(--honey);color:#FFFFFF}
.tag{display:inline-block;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.8rem;margin:2px}
.err{color:var(--rose);font-size:.85rem;min-height:1.2em}

/* Surfaces — hierarchy: sheet > panel > tile */
.panel{background:var(--surface);border-radius:var(--r-md);padding:18px;border:1px solid var(--line)}
.tile{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}

/* Hexagon avatar — the signature shape */
.hex{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:var(--honey);object-fit:cover}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2)}
.av.sm{width:38px;height:38px}
.av-wrap{position:relative;flex:none}
.online-dot{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--leaf);border:2px solid var(--surface)}

/* Header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .inner{display:flex;align-items:center;gap:10px;height:60px;max-width:1080px;margin:0 auto;padding:0 16px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.logo .wm{font-family:var(--font-d);font-weight:600;letter-spacing:.02em;font-size:1.15rem;line-height:1}
.logo .wm small{display:block;font-weight:400;font-size:.62rem;color:var(--muted);letter-spacing:0}
.lang-sel{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.85rem}

/* Landing */
.hero{position:relative;overflow:hidden;padding:40px 0 60px}
.hero-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center}
.hero h1{letter-spacing:-.01em}
.hero .sub{font-size:1.15rem;color:var(--muted);max-width:32ch}
.comb{position:relative;height:420px}
.comb .cell{position:absolute;width:118px;height:118px}
.comb .cell img{width:100%;height:100%}
.comb .cell.core{width:150px;height:150px;display:grid;place-items:center;background:var(--ink);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.flybee{position:absolute;font-size:1.4rem;animation:orbit 9s linear infinite;transform-origin:0 0}
@keyframes orbit{from{transform:rotate(0deg) translateX(150px) rotate(0deg)}to{transform:rotate(360deg) translateX(150px) rotate(-360deg)}}
.band{padding:56px 0}
.band.alt{background:var(--surface-2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{padding:20px 0;border-top:3px solid var(--honey)}
.step .n{font-family:var(--font-d);font-size:2rem;color:var(--honey-deep);line-height:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
details.faq{border-bottom:1px solid var(--line);padding:14px 0}
details.faq summary{cursor:pointer;font-family:var(--font-d);font-size:1.05rem;list-style:none}
details.faq summary::after{content:"+";float:right;color:var(--honey-deep)}
details.faq[open] summary::after{content:"–"}
footer.site{padding:30px 0 40px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
footer.site a{color:var(--muted);margin-right:14px}
.hive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mini-card{position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:3/4;background:var(--surface-2)}
.mini-card img{width:100%;height:100%;object-fit:cover}
.mini-card .cap{position:absolute;inset:auto 0 0 0;padding:10px;background:linear-gradient(transparent,rgba(43,4,24,.85));color:#FFF2F8;font-size:.85rem}

/* App shell */
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.screen{padding:14px 16px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav .inner{max-width:560px;margin:0 auto;display:flex}
.bottomnav a{flex:1;text-align:center;padding:8px 2px 10px;text-decoration:none;color:var(--muted);font-size:.72rem;position:relative}
.bottomnav a .i{display:block;font-size:1.35rem;line-height:1.3}
.bottomnav a.on{color:var(--text);font-weight:600}
.bottomnav a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--honey)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tabs button{flex:none;border:0;background:var(--surface-2);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.9rem}
.tabs button.on{background:var(--ink);color:#FFF2F8}
:root[data-theme="dark"] .tabs button.on{background:var(--honey);color:#FFFFFF}

/* Discover card */
.deck{position:relative;height:min(64vh,560px);margin:6px 0 14px}
.card{position:absolute;inset:0;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);touch-action:none;user-select:none;will-change:transform}
.card .ph{position:absolute;inset:0}
.card .ph img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .info{position:absolute;inset:auto 0 0 0;padding:20px 18px 18px;background:linear-gradient(transparent,rgba(43,4,24,.55) 25%,rgba(43,4,24,.92));color:#FFF2F8}
.card .info h2{margin:0;font-size:1.7rem;color:#FFF2F8}
.card .compat{position:absolute;top:14px;right:14px;width:74px;height:74px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#FFE066,var(--gold) 55%,var(--gold-deep));color:#2B0418;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);font-family:var(--font-d);line-height:1.05}
.card .compat b{font-size:1.25rem;font-weight:600;display:block}
.card .compat span{font-size:.62rem}
.card .stamp{position:absolute;top:30px;padding:6px 14px;border:4px solid;border-radius:10px;font-family:var(--font-d);font-size:1.6rem;opacity:0;transform:rotate(-14deg)}
.card .stamp.like{left:20px;color:#7BE09A;border-color:#7BE09A}
.card .stamp.nope{right:20px;color:#9AA8C2;border-color:#9AA8C2;transform:rotate(14deg)}
.card .vbadge{display:inline-block;background:var(--sky);color:#fff;border-radius:999px;font-size:.7rem;padding:2px 8px;vertical-align:middle;margin-left:6px}
.card .boosted{position:absolute;top:14px;left:14px;background:var(--ink);color:var(--gold);border-radius:999px;padding:4px 10px;font-size:.75rem}
.actions{display:flex;justify-content:center;align-items:center;gap:12px}
.act{appearance:none;border:0;cursor:pointer;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s}
.act:active{transform:scale(.9)}
.act.lg{width:66px;height:66px;font-size:1.7rem}
.act.md{width:52px;height:52px;font-size:1.3rem}
.act.sm{width:42px;height:42px;font-size:1rem}
.bee-ambient{position:absolute;font-size:1rem;opacity:.55;pointer-events:none;animation:drift 12s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-14px)}}

/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 60px - 84px);height:calc(100dvh - 60px - 84px)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:78%;padding:9px 13px;border-radius:18px;word-wrap:break-word;position:relative}
.bubble.me{align-self:flex-end;background:var(--honey);color:#FFFFFF;border-bottom-right-radius:5px}
.bubble.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble img{border-radius:12px;max-height:240px}
.bubble .meta{font-size:.68rem;opacity:.7;text-align:right;margin-top:2px}
.sysmsg{align-self:center;font-size:.8rem;color:var(--muted);background:var(--surface-2);padding:4px 12px;border-radius:999px;text-align:center}
.datecard{align-self:center;width:90%;background:var(--surface);border:2px solid var(--honey);border-radius:var(--r-md);padding:12px}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);align-items:center}
.composer .inp{border-radius:999px;padding:10px 16px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.emoji-pop{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:var(--surface-2)}
.emoji-pop button{border:0;background:none;font-size:1.4rem;cursor:pointer}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(43,4,24,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:var(--r-lg)}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 14px}
.match-ov{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 40%,#8A0045,#200512);color:#FFF2F8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center}
.match-ov h1{color:var(--gold);font-size:clamp(2.2rem,9vw,3.6rem)}
.match-pair{display:flex;gap:0;align-items:center}
.match-pair img{width:130px;height:130px}
.match-pair .l{animation:inL .7s cubic-bezier(.2,1.4,.4,1) both}
.match-pair .r{animation:inR .7s cubic-bezier(.2,1.4,.4,1) both;margin-left:-18px}
@keyframes inL{from{transform:translateX(-120px) rotate(-20deg);opacity:0}}
@keyframes inR{from{transform:translateX(120px) rotate(20deg);opacity:0}}
.swarm span{position:absolute;font-size:1.6rem;animation:swarm 2.4s ease-out forwards}
@keyframes swarm{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.toast-wrap{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#FFF2F8;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);font-size:.9rem;max-width:92vw;animation:tin .25s ease}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* Wizard */
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--honey),var(--gold));transition:width .3s}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px;cursor:pointer;text-align:left}
.opt.on{border-color:var(--honey);background:var(--honey-soft)}
.legal-box{max-height:220px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-size:.88rem;white-space:pre-wrap}

/* Profile */
.p-hero{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/5;background:var(--surface-2)}
.p-hero img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:.2s;cursor:pointer}
.switch i::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--honey)}
.switch input:checked+i::after{transform:translateX(20px)}
.tier-card{border:2px solid var(--line);border-radius:var(--r-md);padding:16px;background:var(--surface)}
.tier-card.cur{border-color:var(--honey)}
.tier-card.elite{background:linear-gradient(160deg,#6E0A3C,var(--ink));color:#FFF2F8;border-color:var(--gold)}
.tier-card.elite .muted{color:#F5B0CF}
.seatbar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin:6px 0}
.seatbar i{display:block;height:100%;background:var(--gold)}

/* Admin */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.adm-side{background:var(--ink);color:#FFF2F8;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.adm-side a{display:block;color:#FFDCEB;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:.92rem}
.adm-side a.on{background:var(--honey);color:#FFFFFF}
.adm-side .grp{font-size:.72rem;color:#F08AB8;margin:14px 12px 4px}
.adm-main{padding:20px 24px 60px;min-width:0}
.adm-top{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.kpi b{display:block;font-family:var(--font-d);font-size:1.6rem;font-weight:500}
.kpi span{font-size:.8rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;background:var(--surface-2)}
.st.ok{background:#D9F2E1;color:#1F6B3A}.st.warn{background:#FFEBC2;color:#8A5A00}.st.bad{background:#FBD9DE;color:#9B1C31}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:10px}
.bars div{flex:1;background:var(--honey);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.funnel .fr{display:flex;align-items:center;gap:10px;margin:6px 0}
.funnel .fr i{display:block;height:26px;background:var(--honey);border-radius:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
/* Password hashing: PBKDF2-SHA256, 120k iterations, per-user salt. Never plain text. */
async function hashPassword(pw, salt) {
  salt = salt || [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(salt), iterations: 120000 }, key, 256);
  return { salt, hash: [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('') };
}

/* =====================================================================
   DATABASE — Mock provider with the same table layout as schema.sql
   (UUID primary keys, FK-style references). Swap for Supabase/Postgres by
   re-implementing DB.* against the REST/RPC API.
   ===================================================================== */
const TABLES = ['users', 'profiles', 'photos', 'preferences', 'interests', 'likes', 'matches', 'super_likes', 'blocks', 'conversations', 'messages',
  'date_requests', 'date_events', 'memberships', 'membership_plans', 'membership_permissions', 'subscriptions', 'waitlist', 'credits', 'credit_packages', 'credit_transactions',
  'boosts', 'payments', 'promotions', 'referrals', 'notifications', 'reports', 'moderation_cases', 'moderation_actions', 'verification_requests',
  'admin_users', 'roles', 'permissions', 'audit_logs', 'consents', 'terms_versions', 'privacy_versions', 'safety_acknowledgements',
  'communities', 'community_members', 'events', 'event_members', 'content', 'system_settings', 'feature_flags', 'otp_codes'];
const DB = {
  data: null,
  load() {
    if (Cloud.on) { this.data = {}; TABLES.forEach(tb => this.data[tb] = []); return; }   // cloud: filled by Cloud.pull()
    try { const s = localStorage.getItem(ENV.STORE_KEY); if (s) this.data = JSON.parse(s); } catch (e) { this.data = null; }
    if (!this.data) { this.data = {}; TABLES.forEach(tb => this.data[tb] = []); Seed.run(); this.save(); }
    TABLES.forEach(tb => { if (!this.data[tb]) this.data[tb] = []; });
  },
  save() { if (Cloud.on) return; try { localStorage.setItem(ENV.STORE_KEY, JSON.stringify(this.data)); } catch (e) { console.warn('Storage full or unavailable', e); } },
  all(tb) { return this.data[tb] || (this.data[tb] = []); },
  get(tb, id) { return this.all(tb).find(r => r.id === id); },
  find(tb, fn) { return this.all(tb).find(fn); },
  where(tb, fn) { return this.all(tb).filter(fn); },
  count(tb, fn) { return fn ? this.all(tb).filter(fn).length : this.all(tb).length; },
  insert(tb, row, silent) { const r = { id: uid(), created_at: now(), ...row }; this.all(tb).push(r); if (!silent) this.save(); Cloud.put(tb, r); return r; },
  update(tb, id, patch) { const r = this.get(tb, id); if (r) { Object.assign(r, patch, { updated_at: now() }); this.save(); Cloud.put(tb, r); } return r; },
  remove(tb, id) { this.data[tb] = this.all(tb).filter(r => r.id !== id); this.save(); Cloud.del(tb, [id]); },
  removeWhere(tb, fn) { const ids = this.all(tb).filter(fn).map(r => r.id); this.data[tb] = this.all(tb).filter(r => !fn(r)); this.save(); Cloud.del(tb, ids); },
  page(rows, pageNo = 1, size = 20) { return { rows: rows.slice((pageNo - 1) * size, pageNo * size), total: rows.length, pages: Math.max(1, Math.ceil(rows.length / size)) }; },
  reset() { if (Cloud.on) return location.reload(); try { localStorage.removeItem(ENV.STORE_KEY); localStorage.removeItem(ENV.SESSION_KEY); } catch (e) {} location.hash = '#/'; location.reload(); }
};
const Setting = { get(k, d) { const r = DB.find('system_settings', x => x.key === k); return r ? r.value : d; }, set(k, v) { const r = DB.find('system_settings', x => x.key === k); r ? DB.update('system_settings', r.id, { value: v }) : DB.insert('system_settings', { key: k, value: v }); } };
const Flags = { on(k) { const f = DB.find('feature_flags', x => x.key === k); return !!(f && f.enabled); } };

  SKIP: new Set(['otp_codes']),

  LIVE: ['messages', 'conversations', 'likes', 'matches', 'date_requests', 'notifications', 'memberships', 'credits', 'reports', 'moderation_cases', 'verification_requests', 'feature_flags', 'event_members'],

  loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); },
  async init() {

    if (data && data.session) await this.afterAuth(data.session.user, { autoMember: true });

  /* config tables readable without login (flags, plans, legal, hives, events, content) */
  PUBLIC: ['feature_flags', 'system_settings', 'membership_plans', 'membership_permissions', 'permissions', 'credit_packages', 'terms_versions', 'privacy_versions', 'communities', 'events', 'content', 'roles'],
  async fetchAll(src) {
    const out = []; let from = 0;
    for (;;) {

      if (error) { console.warn('pull', src, error.message); break; }

    await this.pullAll();

      if (!u && opts.autoMember) u = Auth.createUser({ id: user.id, email: user.email || null, phone: user.phone ? '+' + String(user.phone).replace(/^\+/, '') : null, phone_verified: !!user.phone_confirmed_at, auth_provider: user.app_metadata?.provider || 'email' });

      if (!Session.user && !Session.admin) return;
      if (tb === 'messages' || tb === 'date_requests') { const cid = r.conversation_id; if (cid && location.hash === '#/app/chat/' + cid) UI.refreshChat(cid); else if (!$('#sheet-ov') && !document.activeElement?.matches('input,textarea')) Router.render(); }

const MockSms = { // production: replace with Twilio / ThaiBulkSMS provider using same send() contract
  async send(phone, code) { toast(t('otp_sent', { code }), 9000); return { ok: true, provider: 'mock' }; }
};
const Auth = {
  normPhone(p) { p = String(p).replace(/[^\d+]/g, ''); if (p.startsWith('0')) p = '+66' + p.slice(1); return p; },
  async requestOtp(phone) {
    phone = this.normPhone(phone);
    if (!/^\+\d{9,14}$/.test(phone)) throw new Error(t('invalid_phone'));
    if (!RateLimit.ok('otp:' + phone, 3, 60000)) throw new Error(t('otp_rate'));
    const code = randCode(6);
    DB.removeWhere('otp_codes', o => o.phone === phone);
    DB.insert('otp_codes', { phone, code_hash: await sha256(code + phone), expires_at: new Date(Date.now() + 5 * 60000).toISOString(), attempts: 0 });
    await MockSms.send(phone, code);
    return phone;
  },
  async verifyOtp(phone, code) {
    phone = this.normPhone(phone);
    const o = DB.find('otp_codes', x => x.phone === phone);
    if (!o || new Date(o.expires_at) < new Date() || o.attempts >= 5) throw new Error(t('otp_bad'));
    if (o.code_hash !== await sha256(String(code).trim() + phone)) { DB.update('otp_codes', o.id, { attempts: o.attempts + 1 }); throw new Error(t('otp_bad')); }
    DB.remove('otp_codes', o.id);
    let u = DB.find('users', x => x.phone === phone);
    if (!u) u = this.createUser({ phone, auth_provider: 'phone', phone_verified: true });
    return this.startSession(u);
  },
  async registerEmail(email, pw) {
    email = String(email).trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error(t('invalid_email'));
    if (String(pw).length < 8) throw new Error(t('pw_min'));
    if (DB.find('users', x => x.email === email)) throw new Error(t('email_taken'));
    const { salt, hash } = await hashPassword(pw);
    return this.startSession(this.createUser({ email, auth_provider: 'email', password_hash: hash, password_salt: salt }));
  },
  async loginEmail(email, pw) {
    email = String(email).trim().toLowerCase();
    if (!RateLimit.ok('login:' + email, 6, 60000)) throw new Error(t('otp_rate'));
    const u = DB.find('users', x => x.email === email && x.password_hash);
    if (!u) throw new Error(t('invalid_login'));
    const { hash } = await hashPassword(pw, u.password_salt);
    if (hash !== u.password_hash) throw new Error(t('invalid_login'));
    return this.startSession(u);
  },
  social(provider) { // production: OAuth redirect → callback → same createUser/startSession path
    const email = provider.toLowerCase() + '.' + randToken(6).toLowerCase() + '@mock-oauth.clubbee';
    return this.startSession(this.createUser({ email, auth_provider: provider.toLowerCase() }));
  },
  createUser(fields) {
    const ref = sessionStorage.getItem('clubbee.ref');
    const u = DB.insert('users', { phone: null, email: null, status: 'onboarding', is_demo: false, referral_code: 'BEE' + randToken(5), referred_by: null, last_active: now(), online: true, ...fields });
    DB.insert('memberships', { user_id: u.id, plan_code: 'FREE', status: 'active', started_at: now(), expires_at: null });
    DB.insert('credits', { user_id: u.id, balance: 0 });
    if (ref && Flags.on('ENABLE_REFERRAL')) Referral.attach(u, ref);
    Audit.log('USER_REGISTERED', u.id, { provider: fields.auth_provider }, { type: 'user', id: u.id });
    return u;
  },
  startSession(u) {
    if (u.status === 'banned' || u.status === 'suspended') throw new Error(t('account_blocked', { s: u.status }));
    if (u.status === 'deactivated') DB.update('users', u.id, { status: 'active' });
    Session.s.userId = u.id; Session.save();
    DB.update('users', u.id, { last_active: now(), online: true });
    return u;
  },
  logout() { if (Session.user) DB.update('users', Session.user.id, { online: false, last_active: now() }); Session.s.userId = null; Session.save(); }
};

const Legal = {
  active(type) { const tb = type === 'PRIVACY' ? 'privacy_versions' : 'terms_versions'; return DB.find(tb, d => d.type === type && d.active); },
  required: ['TERMS', 'PRIVACY', 'SAFETY'],
  record(user_id, type) {
    const d = this.active(type); if (!d) return;
    return DB.insert('consents', { user_id, consent_type: type, terms_version: d.code, accepted_at: now(), ip_address: 'mock-ip', user_agent: navigator.userAgent.slice(0, 160), document_hash: d.hash });
  },
  outstanding(user_id) { return this.required.filter(type => { const d = this.active(type); return d && !DB.find('consents', c => c.user_id === user_id && c.terms_version === d.code); }); },
  publish(type, body) {
    const tb = type === 'PRIVACY' ? 'privacy_versions' : 'terms_versions';
    const prev = this.active(type); const [maj, min] = (prev ? prev.version : '0.9').split('.').map(Number);
    const version = maj + '.' + (min + 1);
    DB.where(tb, d => d.type === type && d.active).forEach(d => DB.update(tb, d.id, { active: false }));
    const d = DB.insert(tb, { type, version, code: type + '_V' + version, body, hash: docHash(body), active: true, published_at: now() });
    if (this.required.includes(type)) DB.where('users', u => !u.is_demo).forEach(u => Notify.send(u.id, 'terms'));
    Audit.log('LEGAL_VERSION_PUBLISHED', d.code, { previous: prev && prev.code });
    return d;
  }

};
/* Secure image pipeline: MIME + size check, then canvas re-encode (strips EXIF/GPS) */
async function processImage(file, max = 900) {
  if (!file || !['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || file.size > 5 * 1024 * 1024) throw new Error(t('img_invalid'));
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(t('img_invalid'))); i.src = url; });
    const sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .82);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------------- Membership & Dynamic Permission Engine ---------------- */
const Members = {
  planOf(user_id) { const m = DB.find('memberships', x => x.user_id === user_id && x.status === 'active'); const code = m && (!m.expires_at || new Date(m.expires_at) > new Date()) ? m.plan_code : 'FREE'; return DB.find('membership_plans', p => p.code === code) || DB.find('membership_plans', p => p.code === 'FREE'); },
  perm(user_id, key) {
    const plan = Flags.on('ENABLE_PREMIUM') ? this.planOf(user_id) : DB.find('membership_plans', p => p.code === 'FREE');
    const row = DB.find('membership_permissions', r => r.plan_code === plan.code && r.key === key);

  },
  seatsUsed(plan) { return (plan.reserved_seats || 0) + DB.count('memberships', m => m.plan_code === plan.code && m.status === 'active'); },
  setPlan(user_id, code, days, by = 'purchase') {

    if (code !== 'FREE') DB.insert('subscriptions', { user_id, plan_code: code, membership_id: m.id, status: 'active', renews: false, current_period_end: m.expires_at });

};
const Quota = {
  used(user_id, key) {
    const today = r => sameDay(r.created_at, new Date());
    if (key === 'daily_likes') return DB.count('likes', l => l.from_id === user_id && (l.type === 'like' || l.type === 'super') && today(l));
    if (key === 'super_likes') return DB.count('likes', l => l.from_id === user_id && l.type === 'super' && today(l) && !l.paid);
    if (key === 'date_requests') return DB.count('date_requests', d => d.from_id === user_id && today(d));
    return 0;
  },
  resetAt: {},
  can(user_id, key) {
    const lim = Members.perm(user_id, key);
    if (lim === -1 || lim === true) return true; if (lim === false || lim == null) return false;
    const reset = DB.find('system_settings', s => s.key === 'quota_reset:' + user_id);
    const baseline = reset && sameDay(reset.value.at, new Date()) ? (reset.value[key] || 0) : 0;
    return this.used(user_id, key) - baseline < lim;
  },
  reset(user_id) { const v = { at: now() }; ['daily_likes', 'super_likes', 'date_requests'].forEach(k => v[k] = this.used(user_id, k)); Setting.set('quota_reset:' + user_id, v); }
};

/* ---------------- Matching ---------------- */
const Match = {
  compat(me, p) {
    if (!me || !p) return 50;
    const a = new Set(me.interests || []), shared = (p.interests || []).filter(x => a.has(x)).length;
    let s = 30 + Math.min(shared, 4) * 9;
    if (me.goal && me.goal === p.goal) s += 14; else if (me.goal === 'open' || p.goal === 'open') s += 6;
    if (me.city === p.city) s += 12;
    const lang = (p.languages || []).some(l => (me.languages || []).includes(l)); if (lang) s += 6;
    const age = Profiles.age(p); if (age >= (me.age_min || 18) && age <= (me.age_max || 99)) s += 6;
    const ls = ['drink', 'smoke', 'workout'].filter(k => me.lifestyle?.[k] && me.lifestyle[k] === p.lifestyle?.[k]).length; s += ls * 2;
    return clamp(s, 35, 98);
  },
  blocked(a, b) { return !!DB.find('blocks', x => (x.blocker_id === a && x.blocked_id === b) || (x.blocker_id === b && x.blocked_id === a)); },
  acted(me, other) { return DB.find('likes', l => l.from_id === me && l.to_id === other && l.type !== 'save'); },
  boostActive(user_id) { return DB.find('boosts', b => b.user_id === user_id && new Date(b.ends_at) > new Date()); },
  deck(user_id, f = {}) {
    const me = Profiles.of(user_id); if (!me) return [];
    const wantG = me.pref_gender;
    let list = DB.where('profiles', p => p.user_id !== user_id && Profiles.isVisible(p) && !this.blocked(user_id, p.user_id) && !this.acted(user_id, p.user_id));
    list = list.filter(p => wantG === 'everyone' || p.gender === wantG || !wantG);
    const amin = f.age_min || me.age_min || 18, amax = f.age_max || me.age_max || 99;
    list = list.filter(p => { const a = Profiles.age(p); return a >= amin && a <= amax; });
    if (f.city) list = list.filter(p => p.city === f.city);
    if (f.goal) list = list.filter(p => p.goal === f.goal);
    if (f.verified) list = list.filter(p => p.verification?.identity || p.verification?.profile);
    if (f.interest) list = list.filter(p => (p.interests || []).includes(f.interest));
    if (f.lang) list = list.filter(p => (p.languages || []).includes(f.lang));
    const prio = Flags.on('ENABLE_PREMIUM');
    return list.map(p => ({ p, score: this.compat(me, p), boost: Flags.on('ENABLE_BOOST') && !!this.boostActive(p.user_id), prio: prio && Members.perm(p.user_id, 'priority_matching') }))
      .sort((x, y) => (y.boost - x.boost) || (y.prio - x.prio) || (y.score - x.score + (Math.random() - .5) * 12));
  },
  matchBetween(a, b) { return DB.find('matches', m => ((m.user_a === a && m.user_b === b) || (m.user_a === b && m.user_b === a)) && !m.unmatched); },
  act(user_id, target, type) {
    if (!RateLimit.ok('like:' + user_id, 40, 10000)) throw new Error(t('msg_rate'));
    if (this.blocked(user_id, target)) return {};
    if (type === 'save') { if (!DB.find('likes', l => l.from_id === user_id && l.to_id === target && l.type === 'save')) DB.insert('likes', { from_id: user_id, to_id: target, type: 'save' }); return { saved: true }; }
    if (type === 'pass') { DB.insert('likes', { from_id: user_id, to_id: target, type: 'pass' }); return {}; }
    let paid = false;
    if (type === 'like' && !Quota.can(user_id, 'daily_likes')) throw new Error(t('daily_limit', { k: t('like') }));
    if (type === 'super' && !Quota.can(user_id, 'super_likes')) {
      const cost = Setting.get('super_like_credit_cost', 5);
      if (Flags.on('ENABLE_CREDITS') && Credits.balance(user_id) >= cost) { Credits.add(user_id, -cost, 'SUPER_LIKE'); paid = true; }
      else throw new Error(t('daily_limit', { k: t('super_like') }));
    }
    DB.insert('likes', { from_id: user_id, to_id: target, type, paid });
    if (type === 'super') DB.insert('super_likes', { from_id: user_id, to_id: target, paid });
    const tu = DB.get('users', target);
    let back = DB.find('likes', l => l.from_id === target && l.to_id === user_id && (l.type === 'like' || l.type === 'super'));
    if (!back && tu?.is_demo && Math.random() < (type === 'super' ? Math.min(.95, (tu.likes_back || .4) + .2) : (tu.likes_back || .4))) back = DB.insert('likes', { from_id: target, to_id: user_id, type: 'like', auto: true });
    if (!tu?.is_demo) Notify.send(target, 'like', { name: Profiles.of(user_id)?.display_name || 'Someone' });
    if (back && !this.matchBetween(user_id, target)) {
      const m = DB.insert('matches', { user_a: user_id, user_b: target, favorite_by: [] });
      DB.insert('conversations', { match_id: m.id, members: [user_id, target], muted_by: [], deleted_by: [], last_message_at: now() });
      Notify.send(user_id, 'match', { name: Profiles.of(target).display_name });
      if (!tu?.is_demo) Notify.send(target, 'match', { name: Profiles.of(user_id).display_name });
      return { match: m };
    }
    return {};
  },
  myMatches(user_id) { return DB.where('matches', m => (m.user_a === user_id || m.user_b === user_id) && !m.unmatched).map(m => ({ m, other: m.user_a === user_id ? m.user_b : m.user_a })).filter(x => !this.blocked(user_id, x.other)); },
  likedMe(user_id) { return DB.where('likes', l => l.to_id === user_id && (l.type === 'like' || l.type === 'super') && !this.matchBetween(user_id, l.from_id) && !this.blocked(user_id, l.from_id)); }
};

const Dates = {

    else Notify.send(to, 'date', { name: Profiles.of(user_id).display_name });

  },
  setStatus(user_id, id, status, patch = {}) {
    const r = DB.get('date_requests', id); if (!r || (r.from_id !== user_id && r.to_id !== user_id)) throw new Error('Forbidden');
    DB.update('date_requests', id, { ...patch, status, history: [...r.history, { status, at: now(), by: user_id, ...patch }] });
    const other = r.from_id === user_id ? r.to_id : r.from_id;
    const ou = DB.get('users', other);
    if (status === 'accepted') { Notify.send(r.from_id === user_id ? r.to_id : r.from_id, 'date_acc', { name: Profiles.of(user_id).display_name }); if (!ou?.is_demo || r.from_id !== user_id) Notify.send(r.from_id === user_id ? user_id : r.from_id, 'date_rem', { name: Profiles.of(other).display_name, d: r.date }); }
    DB.insert('date_events', { date_request_id: id, status, by: user_id, meta: patch });
  },
  mine(user_id) { return DB.where('date_requests', d => d.from_id === user_id || d.to_id === user_id).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)); }
};

/* ---------------- Safety: block / report / verification ---------------- */
const Safety = {
  block(user_id, target) { if (!Match.blocked(user_id, target)) DB.insert('blocks', { blocker_id: user_id, blocked_id: target }); Audit.log('USER_BLOCKED', target, {}, { type: 'user', id: user_id }); },
  unblock(user_id, target) { DB.removeWhere('blocks', b => b.blocker_id === user_id && b.blocked_id === target); },
  report(user_id, target, type, detail, conversation_id) {
    if (!RateLimit.ok('report:' + user_id, 5, 60000)) throw new Error(t('msg_rate'));
    const r = DB.insert('reports', { reporter_id: user_id, target_user_id: target, conversation_id: conversation_id || null, type, detail: String(detail || '').slice(0, 1000), status: 'new' });
    const n = DB.count('moderation_cases') + 1001;
    const cs = DB.insert('moderation_cases', { case_no: 'CB-' + n, report_id: r.id, target_user_id: target, conversation_id: conversation_id || null, status: 'open', priority: ['scam', 'harass'].includes(type) ? 'high' : 'normal', assigned_to: null });
    DB.update('reports', r.id, { case_id: cs.id });
    return r;
  },
  requestVerification(user_id, type) {
    if (DB.find('verification_requests', v => v.user_id === user_id && v.type === type && v.status === 'pending')) return;
    return DB.insert('verification_requests', { user_id, type, status: 'pending' });
  }
};

/* ---------------- Credits / Boost / Payments / Promotions / Referral ---------------- */
const Credits = {
  row(user_id) { return DB.find('credits', c => c.user_id === user_id) || DB.insert('credits', { user_id, balance: 0 }); },
  balance(user_id) { return this.row(user_id).balance; },
  add(user_id, amount, reason, ref) { const r = this.row(user_id); if (r.balance + amount < 0) throw new Error(t('not_enough_credits')); DB.update('credits', r.id, { balance: r.balance + amount }); DB.insert('credit_transactions', { user_id, amount, reason, ref: ref || null, balance_after: r.balance }); if (amount > 0 && reason !== 'ADMIN_ADJUST') Notify.send(user_id, 'credit', { n: amount }); }
};
const Boost = {
  start(user_id, minutes) {
    if (!Flags.on('ENABLE_BOOST')) throw new Error(t('coming_soon'));
    const price = Setting.get('boost_prices', {})[minutes]; if (!price) throw new Error('Invalid');
    const monthUsed = DB.count('boosts', b => b.user_id === user_id && b.source === 'plan' && new Date(b.created_at).getMonth() === new Date().getMonth());
    const free = monthUsed < (Members.perm(user_id, 'boosts') || 0) && minutes <= 30;
    if (!free) { if (!Flags.on('ENABLE_CREDITS')) throw new Error(t('not_enough_credits')); Credits.add(user_id, -price, 'BOOST_' + minutes); }
    const cur = Match.boostActive(user_id); const start = cur ? new Date(cur.ends_at) : new Date();
    return DB.insert('boosts', { user_id, minutes, source: free ? 'plan' : 'credits', starts_at: start.toISOString(), ends_at: new Date(start.getTime() + minutes * 60000).toISOString() });
  }
};
const MockPaymentGateway = { // production: Omise / 2C2P / Stripe — tokenised card or PromptPay QR; card data never touches Club Bee
  async charge({ amount, currency, description }) { await sleep(900); return { ok: true, ref: 'MOCK-' + randToken(10), amount, currency, description }; }
};
const Promo = {
  validate(code, applies_to, plan_code, user_id) {
    const p = DB.find('promotions', x => x.code === String(code).trim().toUpperCase() && x.active);
    if (!p) return null; const n = new Date();
    if (new Date(p.starts_at) > n || new Date(p.ends_at) < n || p.used >= p.usage_limit) return null;
    if (p.applies_to && p.applies_to !== applies_to) return null;
    if (plan_code && p.eligible?.length && !p.eligible.includes(plan_code)) return null;
    if (p.first_purchase_only && DB.find('payments', x => x.user_id === user_id && x.status === 'paid')) return null;
    return p;
  },
  discount(p, amount) { if (!p) return 0; return Math.min(amount, p.type === 'percent' ? Math.round(amount * p.value / 100) : p.value); }
};
const Payments = {
  async purchase(user_id, { kind, item, amount, coupon }) {
    const promo = coupon ? Promo.validate(coupon, kind, kind === 'membership' ? item : null, user_id) : null;
    const final = amount - Promo.discount(promo, amount);
    const pay = DB.insert('payments', { user_id, kind, item, amount: final, list_amount: amount, currency: 'THB', status: 'pending', provider: 'mock', coupon: promo?.code || null });
    const res = await MockPaymentGateway.charge({ amount: final, currency: 'THB', description: kind + ':' + item });
    DB.update('payments', pay.id, { status: res.ok ? 'paid' : 'failed', provider_ref: res.ref });
    if (!res.ok) throw new Error('Payment failed');
    if (promo) DB.update('promotions', promo.id, { used: promo.used + 1 });
    Referral.event(user_id, 'purchase');
    return pay;
  }
};
const Referral = {
  attach(u, code) { const ref = DB.find('users', x => x.referral_code === String(code).toUpperCase()); if (!ref || ref.id === u.id) return; DB.update('users', u.id, { referred_by: ref.id }); DB.insert('referrals', { referrer_id: ref.id, new_user_id: u.id, events: [{ e: 'registration', at: now() }], reward: 0, status: 'registered' }); },
  event(user_id, e) {
    const r = DB.find('referrals', x => x.new_user_id === user_id); if (!r) return;
    DB.update('referrals', r.id, { events: [...r.events, { e, at: now() }] });
    if (e === 'profile_complete' && !r.reward && Flags.on('ENABLE_REFERRAL')) { const n = Setting.get('referral_reward_credits', 20); DB.update('referrals', r.id, { reward: n, status: 'rewarded' }); if (Flags.on('ENABLE_CREDITS') && !Cloud.on) { Credits.add(r.referrer_id, n, 'REFERRAL', r.id); Credits.add(user_id, n, 'REFERRAL_WELCOME', r.id); } }
  }
};
const Hive = {
  join(user_id, cid) { if (!DB.find('community_members', m => m.community_id === cid && m.user_id === user_id)) DB.insert('community_members', { community_id: cid, user_id, role: 'member' }); },
  leave(user_id, cid) { DB.removeWhere('community_members', m => m.community_id === cid && m.user_id === user_id); },
  register(user_id, eid) {
    const e = DB.get('events', eid); if (DB.find('event_members', m => m.event_id === eid && m.user_id === user_id)) return;
    if (DB.count('event_members', m => m.event_id === eid && m.status !== 'cancelled') >= e.seats) throw new Error(t('event_full'));

  }
};

/* =====================================================================
   ADMIN — separate auth, RBAC, super-admin protection
   ===================================================================== */
const AdminAuth = {
  bootstrapped() { return !!DB.find('admin_users', a => a.role === 'SUPER_ADMIN'); },
  async bootstrap() { // production: read SUPER_ADMIN_EMAIL / SUPER_ADMIN_PASSWORD from server env on first deploy
    if (this.bootstrapped()) return null;
    const temp = randToken(4) + '-' + randToken(4) + '-' + randToken(4);
    const { salt, hash } = await hashPassword(temp);
    DB.insert('admin_users', { email: ENV.SUPER_ADMIN_EMAIL, name: 'Super Admin', role: 'SUPER_ADMIN', password_hash: hash, password_salt: salt, must_change_password: true, status: 'active', protected: true });
    Audit.log('SUPER_ADMIN_BOOTSTRAPPED', ENV.SUPER_ADMIN_EMAIL, {}, { type: 'system', id: 'env' });
    return temp;
  },
  async login(email, pw) {
    email = String(email).trim().toLowerCase();
    if (!RateLimit.ok('admin:' + email, 5, 60000)) throw new Error('Too many attempts. Wait a minute.');
    const a = DB.find('admin_users', x => x.email === email && x.status === 'active');
    if (!a) { Audit.log('ADMIN_LOGIN_FAILED', email, {}, { type: 'anon', id: 'anon' }); throw new Error('Email or password is incorrect.'); }
    const { hash } = await hashPassword(pw, a.password_salt);
    if (hash !== a.password_hash) { Audit.log('ADMIN_LOGIN_FAILED', email, {}, { type: 'anon', id: 'anon' }); throw new Error('Email or password is incorrect.'); }
    Session.s.adminId = a.id; Session.save(); DB.update('admin_users', a.id, { last_login: now() }); Audit.log('ADMIN_LOGIN', a.email);
    return a;
  },
  async changePassword(a, pw) {
    if (pw.length < 12 || !/[A-Z]/.test(pw) || !/[a-z]/.test(pw) || !/\d/.test(pw)) throw new Error('Use 12+ characters with upper-case, lower-case and a number.');
    const { salt, hash } = await hashPassword(pw); DB.update('admin_users', a.id, { password_hash: hash, password_salt: salt, must_change_password: false }); Audit.log('ADMIN_PASSWORD_CHANGED', a.email);
  },
  logout() { if (Session.admin) Audit.log('ADMIN_LOGOUT', Session.admin.email); Session.s.adminId = null; Session.save(); }
};
const RBAC = {
  perms(a) { if (!a) return []; const r = DB.find('roles', x => x.code === a.role); return r ? r.permissions : []; },
  can(key, a = Session.admin) { const p = this.perms(a); return p.includes('*') || p.includes(key); },
  require(key) { if (!this.can(key)) { Audit.log('PERMISSION_DENIED', key); throw new Error('You don’t have permission: ' + key); } },
  /* Other admins can never edit, delete, demote or change the password of SUPER_ADMIN */
  canManageAdmin(target, a = Session.admin) { if (!a || !this.can('admin_roles', a)) return false; if (target.role === 'SUPER_ADMIN') return a.id === target.id && false; return true; }
};
const Moderation = {
  act(caseId, action, note) {
    RBAC.require('reports.act');
    const cs = DB.get('moderation_cases', caseId); const target = cs.target_user_id;
    const map = { warning: null, restrict: 'restricted', suspend: 'suspended', ban: 'banned' };
    if (map[action]) DB.update('users', target, { status: map[action], online: false });
    if (action === 'remove_content' && cs.conversation_id && !Cloud.on) DB.where('messages', m => m.conversation_id === cs.conversation_id && m.sender_id === target).slice(-3).forEach(m => { m.removed = true; });
    if (action === 'warning') Notify.send(target, 'broadcast', { title: 'Club Bee', body: 'Warning: please follow the Community Guidelines.' });
    DB.insert('moderation_actions', { case_id: caseId, admin_id: Session.admin.id, action, note });
    DB.update('moderation_cases', caseId, { status: action === 'dismiss' ? 'closed' : 'actioned', assigned_to: Session.admin.id });
    const r = DB.get('reports', cs.report_id); if (r) DB.update('reports', r.id, { status: action === 'dismiss' ? 'rejected' : 'action_taken' });
    Audit.log('MODERATION_ACTION', cs.case_no, { action, note, target_user_id: target });
    DB.save();
  },
  /* Report → Case → Authorised moderator → Limited access → Action → Audit */
  openConversation(caseId, reason, emergency) {
    if (!Flags.on('ENABLE_CHAT_MODERATION')) throw new Error('Chat moderation is disabled by feature flag.');
    RBAC.require(emergency ? 'EMERGENCY_ACCESS' : 'CHAT_MODERATION_VIEW');
    if (String(reason).trim().length < 15) throw new Error('Give a specific reason (15+ characters).');
    const cs = DB.get('moderation_cases', caseId); if (!cs?.conversation_id) throw new Error('This case has no linked conversation.');
    Audit.log(emergency ? 'EMERGENCY_CHAT_ACCESS' : 'CHAT_MODERATION_VIEW', cs.conversation_id, { moderator_id: Session.admin.id, conversation_id: cs.conversation_id, case_id: cs.case_no, reason, access_time: now(), scope: 'last 30 messages' });
    return Chat.messages(cs.conversation_id).slice(-30);
  }
};

/* =====================================================================
   CLOUD-MODE SERVICE OVERRIDES — same function names, real providers.
   ===================================================================== */
if (Cloud.on) {
  const sbErr = (error, fallback) => { if (error) throw new Error(fallback || error.message); };
  Object.assign(Auth, {
    async requestOtp(phone) {
      phone = this.normPhone(phone);
      if (!/^\+\d{9,14}$/.test(phone)) throw new Error(t('invalid_phone'));
      if (!RateLimit.ok('otp:' + phone, 3, 60000)) throw new Error(t('otp_rate'));
      const { error } = await Cloud.sb.auth.signInWithOtp({ phone });
      sbErr(error, error && /provider|sms/i.test(error.message) ? t('sms_not_ready') : null);
      return phone;
    },
    async verifyOtp(phone, code) {
      const { data, error } = await Cloud.sb.auth.verifyOtp({ phone: this.normPhone(phone), token: String(code).trim(), type: 'sms' });
      sbErr(error, t('otp_bad'));
      return Cloud.memberSignedIn(data.user, { phone: this.normPhone(phone), auth_provider: 'phone', phone_verified: true });
    },
    async registerEmail(email, pw) {
      email = String(email).trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error(t('invalid_email'));
      if (String(pw).length < 8) throw new Error(t('pw_min'));
      const { data, error } = await Cloud.sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: location.origin + location.pathname } });
      sbErr(error, error && /registered/i.test(error.message) ? t('email_taken') : null);
      if (!data.session) throw new Error(t('check_email'));
      return Cloud.memberSignedIn(data.user, { email, auth_provider: 'email' });
    },
    async loginEmail(email, pw) {
      email = String(email).trim().toLowerCase();
      if (!RateLimit.ok('login:' + email, 6, 60000)) throw new Error(t('otp_rate'));
      const { data, error } = await Cloud.sb.auth.signInWithPassword({ email, password: pw });
      sbErr(error, error && /confirm/i.test(error.message) ? t('check_email') : t('invalid_login'));
      return Cloud.memberSignedIn(data.user, { email, auth_provider: 'email' });
    },
    async social(provider) {
      const { error } = await Cloud.sb.auth.signInWithOAuth({ provider: provider.toLowerCase(), options: { redirectTo: location.origin + location.pathname } });
      sbErr(error, error && /not enabled|provider/i.test(error.message) ? t('oauth_not_ready', { p: provider }) : null);
      return new Promise(() => {});                                    // browser is redirecting
    },
    logout() { if (Session.user) DB.update('users', Session.user.id, { online: false, last_active: now() }); Cloud.signOut(); }
  });

  Object.assign(AdminAuth, {
    bootstrapped() { return true; },
    async bootstrap() { return null; },
    async login(email, pw) {
      email = String(email).trim().toLowerCase();
      if (!RateLimit.ok('admin:' + email, 5, 60000)) throw new Error('Too many attempts. Wait a minute.');
      const { data, error } = await Cloud.sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw new Error(/confirm/i.test(error.message) ? 'Confirm your email first (check your inbox), then sign in.' : 'Email or password is incorrect.');
      const adm = await Cloud.rpc('link_admin');
      if (!adm) { await Cloud.sb.auth.signOut(); throw new Error('This email is not an active admin. Ask the SUPER_ADMIN to add it in Admin roles.'); }
      await Cloud.afterAuth(data.user);
      if (!Session.admin) throw new Error('Admin account not found.');
      DB.update('admin_users', Session.admin.id, { last_login: now() }); Audit.log('ADMIN_LOGIN', email);
      return Session.admin;
    },
    async signup(email, pw) {
      email = String(email).trim().toLowerCase();
      if (pw.length < 12 || !/[A-Z]/.test(pw) || !/[a-z]/.test(pw) || !/\d/.test(pw)) throw new Error('Use 12+ characters with upper-case, lower-case and a number.');
      const { data, error } = await Cloud.sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: location.origin + location.pathname + '#/admin' } });
      if (error) throw new Error(error.message);
      if (!data.session) return 'confirm';
      await Cloud.sb.auth.signOut();
      return this.login(email, pw);
    },
    async changePassword(a, pw) {
      if (pw.length < 12 || !/[A-Z]/.test(pw) || !/[a-z]/.test(pw) || !/\d/.test(pw)) throw new Error('Use 12+ characters with upper-case, lower-case and a number.');
      const { error } = await Cloud.sb.auth.updateUser({ password: pw }); if (error) throw new Error(error.message);
      DB.update('admin_users', a.id, { must_change_password: false }); Audit.log('ADMIN_PASSWORD_CHANGED', a.email);
    },
    logout() { if (Session.admin) Audit.log('ADMIN_LOGOUT', Session.admin.email); Cloud.signOut(); }
  });

  const baseAct = Moderation.act.bind(Moderation);
  Object.assign(Moderation, {
    act(caseId, action, note) {
      if (action === 'remove_content') { RBAC.require('reports.act'); Cloud.rpc('moderator_remove_content', { p_case: caseId }).catch(e => toast(e.message)); }
      return baseAct(caseId, action, note);
    },
    async openConversation(caseId, reason, emergency) {
      if (!Flags.on('ENABLE_CHAT_MODERATION')) throw new Error('Chat moderation is disabled by feature flag.');
      RBAC.require(emergency ? 'EMERGENCY_ACCESS' : 'CHAT_MODERATION_VIEW');
      if (String(reason).trim().length < 15) throw new Error('Give a specific reason (15+ characters).');
      const rows = await Cloud.rpc('moderator_read_conversation', { p_case: caseId, p_reason: String(reason).trim(), p_emergency: !!emergency });
      return (rows || []).map(r => ({ ...r.data, id: r.id })).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    }
  });

  Object.assign(Account, {
    remove(user_id) { Cloud.rpc('delete_my_account').then(() => Cloud.signOut()).catch(e => toast(e.message)); Session.s.userId = null; }
  });
  Payments.purchase = async () => { throw new Error(t('pay_not_connected')); };
  Members.seatsUsed = plan => (plan.reserved_seats || 0) + (Cloud.seats[plan.code] || 0);
}

  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${opts.noGrab ? '' : '<div class="grab"></div>'}${html}</div>`;
  if (!opts.locked) ov.addEventListener('click', e => { if (e.target === ov) closeSheet(); });
  $('#overlays').appendChild(ov); const f = ov.querySelector('input,select,textarea,button'); if (f && !opts.noFocus) f.focus({ preventScroll: true });
  return ov;
}

function obValidate() {
  const d = OB.d, s = OB.step;
  if (s === 1) { if (!d.name?.trim() || !d.display_name?.trim() || !d.birthday || !d.gender) return t('need_field'); if (ageOf(d.birthday) < ENV.MIN_AGE) return t('age_block', { n: ENV.MIN_AGE }); }
  if (s === 3 && d.interests.length < 3) return t('need3');
  if (s === 4 && !d.goal) return t('need_field');
  if (s === 5 && !d.pref_gender) return t('need_field');
  if (s === 6 && (!d.city || !d.languages.length)) return t('need_field');
  if (s === 7 && !OB.safety) return t('safety_read');
  if (s === 8 && !OB.terms) return t('terms_accept');
  return null;
}
function obCommit() {
  const u = Session.user, d = OB.d;
  const data = { name: d.name.trim().slice(0, 80), display_name: d.display_name.trim().slice(0, 30), birthday: d.birthday, gender: d.gender, pref_gender: d.pref_gender, city: d.city, languages: d.languages, goal: d.goal, interests: d.interests, about: (d.about || '').slice(0, 400), lifestyle: d.lifestyle || {}, age_min: +d.age_min, age_max: +d.age_max, avatar: d.avatar,
    verification: { phone: !!u.phone_verified, identity: false, profile: false }, privacy: { visible: true, online: true, last_active: true, search: true, msg_requests: true, location: true } };
  const p = Profiles.save(u.id, data);
  DB.insert('preferences', { user_id: u.id, pref_gender: data.pref_gender, age_min: data.age_min, age_max: data.age_max, updated: now() });
  DB.removeWhere('interests', x => x.user_id === u.id); data.interests.forEach(k => DB.insert('interests', { user_id: u.id, key: k }, true));
  if (OB.photo) { DB.removeWhere('photos', x => x.user_id === u.id); DB.insert('photos', { user_id: u.id, url: OB.photo, is_primary: true, moderation: 'approved' }); }
  ['TERMS', 'PRIVACY', 'SAFETY'].forEach(k => Legal.record(u.id, k));
  DB.insert('safety_acknowledgements', { user_id: u.id, context: 'ONBOARDING', safety_version: Legal.active('SAFETY').code, accepted_at: now() });
  DB.update('users', u.id, { status: 'active' });
  DB.update('profiles', p.id, { completion: Profiles.completion(p) });
  Referral.event(u.id, 'profile_complete');
  // Seed a warm start: a few demo bees who already like you (so early likes turn into matches)
  const cands = Cloud.on ? [] : Match.deck(u.id).slice(0, 12).map(x => x.p);
  cands.filter((_, i) => i % 3 === 0).forEach(c => DB.insert('likes', { from_id: c.user_id, to_id: u.id, type: 'like', auto: true }, true));
  DB.save();
}

function bindSwipe() {
  const c = $('#topcard'); if (!c) return;
  let sx = 0, sy = 0, dx = 0, dy = 0, drag = false;
  const like = c.querySelector('.stamp.like'), nope = c.querySelector('.stamp.nope');
  c.addEventListener('pointerdown', e => { if (e.target.closest('[data-act]')) return; drag = true; sx = e.clientX; sy = e.clientY; c.setPointerCapture(e.pointerId); c.style.transition = 'none'; });
  c.addEventListener('pointermove', e => { if (!drag) return; dx = e.clientX - sx; dy = e.clientY - sy; c.style.transform = `translate(${dx}px,${dy}px) rotate(${dx / 18}deg)`; like.style.opacity = clamp(dx / 100, 0, 1); nope.style.opacity = clamp(-dx / 100, 0, 1); });
  const end = () => { if (!drag) return; drag = false; c.style.transition = 'transform .3s'; if (dx > 110) doSwipe('like'); else if (dx < -110) doSwipe('pass'); else if (dy < -130) doSwipe('super'); else { c.style.transform = ''; like.style.opacity = 0; nope.style.opacity = 0; } dx = dy = 0; };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
function doSwipe(type) {
  const c = $('#topcard'); if (!c) return; const target = c.dataset.uid;
  let res;

  const out = { like: 'translate(140%,-10%) rotate(22deg)', pass: 'translate(-140%,-10%) rotate(-22deg)', super: 'translate(0,-140%)', save: 'translate(0,140%)' }[type];
  c.style.transition = 'transform .35s ease-in'; c.style.transform = out;
  setTimeout(() => { Router.render(); if (res && res.match) showMatch(target, res.match); }, 300);
}

function bars(values, labels) { const mx = Math.max(1, ...values); return `<div class="bars">${values.map((v, i) => `<div style="height:${v / mx * 100}%" title="${labels ? labels[i] + ': ' : ''}${v}"></div>`).join('')}</div>`; }

/* =====================================================================
   ROUTER
   ===================================================================== */
const Router = {
  parts() { return (location.hash || '#/').replace(/^#\/?/, '').split('?')[0].split('/').filter(Boolean); },
  render() {
    const parts = this.parts(); let html = '';
    const u = Session.user;
    document.body.classList.toggle('admin-mode', parts[0] === 'admin');
    if (parts[0] !== 'app' || parts[1] !== 'chat' || !parts[2]) ChatUI.cid = null;
    if (u && ['banned', 'suspended', 'deleted'].includes(u.status)) { const s = u.status; Auth.logout(); if (s !== 'deleted') toast(t('account_blocked', { s })); }
    const me = Session.user;
    if (parts[0] === 'admin') { html = viewAdmin(); document.title = 'Club Bee Admin'; }
    else if (!parts[0]) { if (me && me.status === 'active' && Session.profile) return go('#/app/discover'); html = viewLanding(); document.title = 'Club Bee — ผึ้งน้อยรุมล้อม'; }
    else if (parts[0] === 'auth') { if (me) return afterLogin(); html = viewAuth(); }
    else if (parts[0] === 'onboard') {
      if (!me) return go('#/auth');
      if (me.status === 'active' && Session.profile && OB.step !== 9) return go('#/app/discover');
      if (OB.uid !== me.id) { obInit(); OB.uid = me.id; }
      html = viewOnboard();
    } else if (parts[0] === 'app') {
      if (!me) return go('#/auth');
      if (me.status !== 'active' || !Session.profile) return go('#/onboard');
      const v = parts[1] || 'discover';
      html = v === 'discover' ? viewDiscover() : v === 'matches' ? viewMatches() : v === 'chat' ? (parts[2] ? viewChatRoom(parts[2]) : viewChatList())
        : v === 'dates' ? viewDates() : v === 'profile' ? viewProfile() : v === 'membership' ? viewMembership() : v === 'credits' ? viewCredits()
        : v === 'hive' ? viewHive() : viewDiscover();
      document.title = 'Club Bee · ' + t('nav_' + (['discover', 'matches', 'chat', 'dates', 'profile', 'hive'].includes(v) ? v : 'profile'));
    } else return go('#/');
    root().innerHTML = html;
    this.after(parts);
  },
  after(parts) {
    bindSwipe();
    const box = $('#msgs'); if (box) box.scrollTop = box.scrollHeight;
    if (parts[0] === 'app' && Session.user && !$('#sheet-ov')) { const miss = Legal.outstanding(Session.user.id); if (miss.length) termsGate(miss); }
  }
};

const UI = {
  isViewingChat(cid) { return location.hash === '#/app/chat/' + cid && document.visibilityState !== 'hidden'; },
  refreshChat(cid) {
    if (!Session.user) return;
    if (location.hash === '#/app/chat/' + cid) {
      const box = $('#msgs'); if (!box) return;
      Chat.markRead(cid, Session.user.id);
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      box.innerHTML = renderMsgs(cid); if (atBottom) box.scrollTop = box.scrollHeight;
    } else if (['#/app/chat', '#/app/dates', '#/app/matches'].includes(location.hash) && !$('#sheet-ov')) Router.render();
  },
  refreshBadges() {
    if (!Session.user || !$('.bottomnav')) return;
    const on = $('.bottomnav a.on'); const tab = on ? on.getAttribute('href').split('/')[2] : 'discover';
    const tmp = document.createElement('div'); tmp.innerHTML = shell('', tab);
    const nb = tmp.querySelector('.bottomnav'), tb = tmp.querySelector('.topbar');
    if (nb) $('.bottomnav').replaceWith(nb); if (tb && $('.topbar')) $('.topbar').replaceWith(tb);
  }
};

async function trySaveFile(filename, text) {
  try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; if (dl && dl.save) { await dl.save({ filename, data: text, mimeType: 'application/json' }); return true; } } catch (e) {}
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) {}
  return false;
}

    if (s === 'approved') { if (p) Profiles.save(v.user_id, { verification: { ...p.verification, [v.type]: true } }); DB.update('verification_requests', v.id, { status: 'approved', reviewed_by: Session.admin.id }); Notify.send(v.user_id, 'broadcast', { title: 'Club Bee', body: '✓ ' + v.type + ' verification approved' }); }
    if (s === 'rejected') { DB.update('verification_requests', v.id, { status: 'rejected', reviewed_by: Session.admin.id }); Notify.send(v.user_id, 'broadcast', { title: 'Club Bee', body: v.type + ' verification was not approved. You can try again.' }); }
