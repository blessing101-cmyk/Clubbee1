function addPurchaseConsent() {
  const b = $('#paybtn'); if (!b) return;
  b.insertAdjacentHTML('beforebegin', `<label class="check"><input type="checkbox" name="agree"><span>${t('terms_accept')} — <a href="#" data-act="legal" data-k="MEMBERSHIP">${t('legal_membership')}</a> · <a href="#" data-act="legal" data-k="REFUND">${t('legal_refund')}</a></span></label><div class="err" id="payerr"></div>`);
}

/* =====================================================================
   FORM SUBMISSIONS
   ===================================================================== */
const Forms = {
  async otpSend(f) { const d = formData(f); AuthUI.phone = await Auth.requestOtp(d.phone); Router.render(); $('input[name=code]')?.focus(); },
  async otpVerify(f) { const d = formData(f); await Auth.verifyOtp(AuthUI.phone, d.code); AuthUI.phone = null; afterLogin(); },
  async email(f) { const d = formData(f); if (AuthUI.emailMode === 'register') await Auth.registerEmail(d.email, d.pw); else await Auth.loginEmail(d.email, d.pw); afterLogin(); },
  filters(f) {
    const d = formData(f); const adv = Members.perm(me(), 'advanced_search');
    const o = { city: d.city || '', goal: d.goal || '', age_min: +d.age_min || 0, age_max: +d.age_max || 0 };
    if (adv) Object.assign(o, { interest: d.interest || '', lang: d.lang || '', verified: !!d.verified });
    Object.keys(o).forEach(k => { if (!o[k]) delete o[k]; }); DiscoverState.filters = o; closeSheet(); Router.render();
  },
  report(f) {
    const d = formData(f); const uid_ = f.dataset.uid, cid = f.dataset.cid || null;
    Safety.report(me(), uid_, d.type, d.detail, cid);
    if (d.block) Safety.block(me(), uid_);
    closeSheet(); toast(t('report_sent'));
    if (d.block && location.hash.startsWith('#/app/chat/')) go('#/app/chat'); else Router.render();
  },
  send(f) { const i = f.body; const v = i.value; if (!v.trim()) return; Chat.send(me(), ChatUI.cid, v); i.value = ''; if (ChatUI.emoji) { ChatUI.emoji = false; Router.render(); } UI.refreshChat(ChatUI.cid); $('.composer input[name=body]')?.focus(); },
  date(f) {
    const d = formData(f); if (!d.ack) return setErr('derr', t('safety_check'));
    Dates.request(me(), f.dataset.cid, { kind: d.kind, date: d.date, time: d.time, place: d.place, safety_ack: true });
    closeSheet(); toast('📅 ' + t('date_sent')); if (location.hash.startsWith('#/app/chat/')) UI.refreshChat(f.dataset.cid); else Router.render(); UI.refreshBadges();
  },
  dateSuggest(f) {
    const d = formData(f); if (!d.ack) return setErr('derr', t('safety_check'));
    if (!d.date || !d.time) return setErr('derr', t('need_field'));
    Dates.setStatus(me(), f.dataset.id, 'rescheduled', { date: d.date, time: d.time });
    DB.insert('safety_acknowledgements', { user_id: me(), context: 'DATE_RESCHEDULE', date_request_id: f.dataset.id, safety_version: Legal.active('SAFETY')?.code, accepted_at: now() });
    closeSheet(); toast(t('st_rescheduled')); if (ChatUI.cid) UI.refreshChat(ChatUI.cid); else Router.render();
  },
  editProfile(f) {
    const d = formData(f); const interests = new FormData(f).getAll('interests');
    if (!d.display_name) return setErr('eperr', t('need_field')); if (interests.length < 3) return setErr('eperr', t('need3'));
    const p = Profiles.save(me(), { display_name: d.display_name.slice(0, 30), about: (d.about || '').slice(0, 400), city: d.city, goal: d.goal, pref_gender: d.pref_gender, interests });
    if (EP.photo) { DB.removeWhere('photos', x => x.user_id === me()); DB.insert('photos', { user_id: me(), url: EP.photo, is_primary: true, moderation: 'approved' }); EP.photo = null; }
    DB.update('profiles', p.id, { completion: Profiles.completion(p) });
    closeSheet(); toast('✓ ' + t('save')); Router.render();
  },
  async checkout(f) {
    const d = formData(f); if (!d.agree) return setErr('payerr', t('terms_accept'));
    const kind = f.dataset.kind, item = f.dataset.item, amount = +f.dataset.amount;
    if (kind === 'membership') { const pl = DB.find('membership_plans', p => p.code === item); if (pl.member_limit && Members.seatsUsed(pl) >= pl.member_limit) throw new Error(t('seats_full')); }
    const btn = $('#paybtn'); btn.disabled = true; btn.textContent = '⏳ …';
    try {
      ['MEMBERSHIP', 'REFUND'].forEach(k => Legal.record(me(), k));
      const pay = await Payments.purchase(me(), { kind, item, amount, coupon: d.coupon });
      if (kind === 'membership') Members.setPlan(me(), item);
      if (kind === 'credits') { const pk = DB.get('credit_packages', item); Credits.add(me(), pk.amount + (pk.bonus || 0), 'PURCHASE', pay.id); }
      Audit.log('PURCHASE', pay.id, { kind, item, amount: pay.amount, method: d.method }, { type: 'user', id: me() });
      closeSheet(); toast('✅ ' + t('pay_success')); Router.render();
    } catch (e) { btn.disabled = false; btn.textContent = t('pay_now', { p: money(amount) }); throw e; }
  },
  /* admin */
  async admLogin(f) { const d = formData(f); await AdminAuth.login(d.email, d.pw); ADM.tempPw = null; Router.render(); },
  async admPw(f) { const d = formData(f); if (d.pw !== d.pw2) throw new Error('Passwords don’t match.'); await AdminAuth.changePassword(Session.admin, d.pw); toast('✓ Password changed'); Router.render(); },
  admBoost(f) { RBAC.require('credits'); const d = formData(f); const v = {}; [15, 30, 60, 120].forEach(m => v[m] = Math.max(0, +d['b' + m] || 0)); Setting.set('boost_prices', v); Setting.set('super_like_credit_cost', Math.max(0, +d.sl || 0)); Audit.log('PRICING_UPDATED', 'boost_prices', { ...v, super_like: +d.sl }); toast('✓ Saved'); Router.render(); },
  admBroadcast(f) {
    RBAC.require('notifications'); const d = formData(f); const ids = audienceIds(d.aud);
    ids.forEach(id => DB.insert('notifications', { user_id: id, type: 'broadcast', vars: { title: d.title.slice(0, 60), body: d.body.slice(0, 300) }, read: false, link: null }, true)); DB.save();
    Audit.log('BROADCAST_SENT', d.aud, { title: d.title, recipients: ids.length }); toast('📣 Sent to ' + ids.length + ' members'); f.reset();
  },
  admSettings(f) { RBAC.require('settings'); const d = formData(f); Setting.set('currency', (d.currency || 'THB').toUpperCase().slice(0, 3)); Setting.set('referral_reward_credits', +d.ref || 0); Setting.set('welcome_credits', +d.welcome || 0); Audit.log('SETTINGS_UPDATED', 'system', d); toast('✓ Saved'); },
  fPlan(f) {
    if (!RBAC.can('pricing') && !RBAC.can('membership.edit')) RBAC.require('pricing');
    const d = formData(f), fd = new FormData(f); let id = f.dataset.id;
    const permissions = {}; PERMISSION_KEYS.forEach(([k, type]) => { permissions[k] = type === 'bool' ? fd.has('perm_' + k) : type === 'number' ? (parseInt(d['perm_' + k], 10) || 0) : (d['perm_' + k] || ''); });
    const row = { name: d.name, desc: d.desc, price: Math.max(0, +d.price || 0), currency: (d.currency || 'THB').toUpperCase(), duration_days: +d.duration_days || 0, member_limit: +d.member_limit || 0, reserved_seats: +d.reserved_seats || 0, sort: +d.sort || 0, status: d.status, permissions };
    let code;
    if (id) { const p = DB.update('membership_plans', id, row); code = p.code; }
    else { code = String(d.code).toUpperCase().replace(/[^A-Z0-9_]/g, ''); if (!code || DB.find('membership_plans', p => p.code === code)) throw new Error('Code missing or already used.'); DB.insert('membership_plans', { code, ...row }); }
    DB.removeWhere('membership_permissions', r => r.plan_code === code); Object.entries(permissions).forEach(([key, value]) => DB.insert('membership_permissions', { plan_code: code, key, value }, true)); DB.save();
    Audit.log(id ? 'PLAN_UPDATED' : 'PLAN_CREATED', code, { price: row.price, member_limit: row.member_limit, permissions }); closeSheet(); toast('✓ ' + code); Router.render();
  },
  fPackage(f) { RBAC.require('credits'); const d = formData(f), fd = new FormData(f); const row = { name: d.name, amount: +d.amount || 0, bonus: +d.bonus || 0, price: +d.price || 0, currency: 'THB', active: fd.has('active') };
    const id = f.dataset.id; id ? DB.update('credit_packages', id, row) : DB.insert('credit_packages', row); Audit.log(id ? 'PACKAGE_UPDATED' : 'PACKAGE_CREATED', row.name, row); closeSheet(); Router.render(); },
  fPromo(f) { RBAC.require('promotion'); const d = formData(f), fd = new FormData(f);
    const code = d.code.toUpperCase().replace(/[^A-Z0-9_-]/g, ''); const id = f.dataset.id;
    if (DB.find('promotions', p => p.code === code && p.id !== id)) throw new Error('Coupon code already exists.');
    if (new Date(d.ends_at) < new Date(d.starts_at)) throw new Error('End date must be after start.');
    const row = { code, name: d.name, type: d.type, value: Math.max(0, +d.value || 0), applies_to: d.applies_to, eligible: d.eligible ? d.eligible.split(',').map(s => s.trim().toUpperCase()).filter(Boolean) : [], starts_at: new Date(d.starts_at).toISOString(), ends_at: new Date(d.ends_at + 'T23:59:59').toISOString(), usage_limit: +d.usage_limit || 1, first_purchase_only: fd.has('first_purchase_only'), active: fd.has('active') };
    if (row.type === 'percent' && row.value > 100) throw new Error('Percent discount can’t exceed 100.');
    id ? DB.update('promotions', id, row) : DB.insert('promotions', { ...row, used: 0 }); Audit.log(id ? 'PROMO_UPDATED' : 'PROMO_CREATED', code, row); closeSheet(); Router.render(); },
  fComm(f) { RBAC.require('communities'); const d = formData(f), fd = new FormData(f); const row = { name: d.name, emoji: d.emoji || '🐝', kind: d.kind, description: d.description, moderated: fd.has('moderated'), status: d.status };
    const id = f.dataset.id; id ? DB.update('communities', id, row) : DB.insert('communities', row); Audit.log(id ? 'HIVE_UPDATED' : 'HIVE_CREATED', row.name); closeSheet(); Router.render(); },
  fEvent(f) { RBAC.require('events'); const d = formData(f); const row = { title: d.title, kind: d.kind, starts_at: new Date(d.starts_at).toISOString(), place: d.place, seats: Math.max(1, +d.seats || 1), price: Math.max(0, +d.price || 0), currency: 'THB', status: d.status, description: d.description };
    const id = f.dataset.id; id ? DB.update('events', id, row) : DB.insert('events', row); Audit.log(id ? 'EVENT_UPDATED' : 'EVENT_CREATED', row.title, { seats: row.seats, status: row.status }); closeSheet(); Router.render(); },
  fContent(f) { RBAC.require('content'); const d = formData(f), fd = new FormData(f); const row = { kind: d.kind, title: d.title, body: d.body, active: fd.has('active') };
    const id = f.dataset.id; id ? DB.update('content', id, row) : DB.insert('content', row); Audit.log(id ? 'CONTENT_UPDATED' : 'CONTENT_CREATED', row.title, { kind: row.kind }); closeSheet(); Router.render(); },
  fLegal(f) { RBAC.require('legal'); const d = formData(f); if ((d.body || '').length < 50) throw new Error('Text is too short.'); const doc = Legal.publish(d.type, d.body); closeSheet(); toast('📄 ' + doc.code + ' published'); Router.render(); },
  async fAdmin(f) {
    RBAC.require('admin_roles'); const d = formData(f); const email = d.email.toLowerCase();
    if (d.role === 'SUPER_ADMIN') throw new Error('SUPER_ADMIN can’t be assigned.');
    if (DB.find('admin_users', a => a.email === email)) throw new Error('Email already exists.');
    if (Cloud.on) { DB.insert('admin_users', { email, name: d.name, role: d.role, must_change_password: false, status: 'active', protected: false, auth_id: null }); Audit.log('ADMIN_CREATED', email, { role: d.role }); closeSheet(); Router.render(); return sheet(`<h2>✅ Admin added</h2><p class="small">Ask <b>${esc(email)}</b> to open <code>/#/admin</code>, type this email with a strong password and tap <b>Create admin login</b>. The account works only after they confirm the email.</p><button class="btn btn-ink btn-block" data-act="closeSheet">Done</button>`); }
    const pw = tempPassword(); const { salt, hash } = await hashPassword(pw);
    DB.insert('admin_users', { email, name: d.name, role: d.role, password_hash: hash, password_salt: salt, must_change_password: true, status: 'active', protected: false });
    Audit.log('ADMIN_CREATED', email, { role: d.role }); Router.render(); showTempPw(email, pw);
  }
};

/* =====================================================================
   CHANGE / INPUT HANDLERS
   ===================================================================== */
const Changes = {
  lang(el) { I18N.set(el.value); closeSheet(); Router.render(); },
  theme(el) { try { localStorage.setItem('clubbee.theme', el.value); } catch (e) {} applyTheme(); },
  async obPhoto(el) { try { OB.photo = await processImage(el.files[0]); Router.render(); } catch (e) { setErr('oberr', e.message); } },
  async chatImage(el) { try { const url = await processImage(el.files[0], 720); Chat.send(me(), ChatUI.cid, url, 'image'); UI.refreshChat(ChatUI.cid); } catch (e) { toast(e.message); } el.value = ''; },
  async editPhoto(el) { try { EP.photo = await processImage(el.files[0]); $('#ephoto').src = EP.photo; } catch (e) { setErr('eperr', e.message); } },
  privacy(el) { const p = Session.profile; Profiles.save(me(), { privacy: { ...(p.privacy || {}), [el.dataset.k]: el.checked } }); Audit.log('PRIVACY_CHANGED', me(), { [el.dataset.k]: el.checked }, { type: 'user', id: me() }); toast('✓'); },
  admSec(el) { ADM.sec = el.value; ADM.page = 1; ADM.q = ''; Router.render(); },
  admSearch(el) { ADM.q = el.value.trim(); ADM.page = 1; Router.render(); },
  admFlag(el) { try { RBAC.require('feature_flags'); const f = DB.find('feature_flags', x => x.key === el.dataset.k); DB.update('feature_flags', f.id, { enabled: el.checked }); Audit.log('FEATURE_FLAG_CHANGED', f.key, { enabled: el.checked }); toast(f.key + ' → ' + (el.checked ? 'ON' : 'OFF')); } catch (e) { el.checked = !el.checked; toast(e.message); } },
  admRole(el) { try { const a = DB.get('admin_users', el.dataset.id); admGuardAdmin(a); if (el.value === 'SUPER_ADMIN') throw new Error('SUPER_ADMIN can’t be assigned.'); const prev = a.role; DB.update('admin_users', a.id, { role: el.value }); Audit.log('ADMIN_ROLE_CHANGED', a.email, { from: prev, to: el.value }); toast('✓ ' + el.value); } catch (e) { toast(e.message); Router.render(); } }
};
function obInput(el) {
  if (el.dataset.ob) {
    const k = el.dataset.ob; let v = el.value;
    if (k === 'age_min' || k === 'age_max') { v = +v; OB.d[k] = v; if (OB.d.age_min > OB.d.age_max) { if (k === 'age_min') OB.d.age_max = v; else OB.d.age_min = v; } const l = $('#agelbl'); if (l) l.textContent = OB.d.age_min + '–' + OB.d.age_max; return; }
    OB.d[k] = v; return true;
  }
  if (el.dataset.ls) { OB.d.lifestyle = { ...(OB.d.lifestyle || {}), [el.dataset.ls]: el.value }; return true; }
  if (el.dataset.obc) { OB[el.dataset.obc] = el.checked; return true; }
}
function applyTheme() { let th = 'auto'; try { th = localStorage.getItem('clubbee.theme') || 'auto'; } catch (e) {} if (th === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th; }

/* =====================================================================
   EVENT DELEGATION
   ===================================================================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.disabled) return;
  const fn = Actions[el.dataset.act]; if (!fn) return;
  try { await fn(el, e); } catch (err) { console.error(err); toast(err.message || 'Error'); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fn = Forms[f.dataset.form]; if (!fn) return;
  const errBox = f.querySelector('.err'); if (errBox) errBox.textContent = '';
  const btn = f.querySelector('button:not([type=button])'); if (btn && f.dataset.form !== 'send' && f.dataset.form !== 'checkout') btn.disabled = true;
  try { await fn(f); } catch (err) { console.error(err); if (errBox && document.body.contains(errBox)) errBox.textContent = err.message; else toast(err.message || 'Error'); }
  finally { if (btn && document.body.contains(btn) && f.dataset.form !== 'checkout') btn.disabled = false; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && (el.dataset.ls || el.dataset.obc)) { obInput(el); return; }
  const k = el.dataset && el.dataset.change; if (k && Changes[k]) Promise.resolve(Changes[k](el)).catch(err => toast(err.message));
});
document.addEventListener('input', e => { const el = e.target; if (el.dataset && (el.dataset.ob || el.dataset.ls || el.dataset.obc)) obInput(el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#match-ov')) $('#match-ov').remove(); else if ($('#sheet-ov') && !$('#gateck')) closeSheet(); } });
document.addEventListener('visibilitychange', () => { const u = Session.user; if (u) { DB.update('users', u.id, { online: document.visibilityState === 'visible', last_active: now() }); } if (document.visibilityState === 'visible' && ChatUI.cid) UI.refreshChat(ChatUI.cid); });


/* ---------- show / hide password (eye button on every password field) ---------- */
const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function enhancePw(scope) {
  (scope || document).querySelectorAll('input[type=password]:not([data-eye])').forEach(i => {
    i.dataset.eye = '1';
    const w = document.createElement('span'); w.className = 'pw-wrap';
    i.parentNode.insertBefore(w, i); w.appendChild(i);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pw-eye';
    const set = shown => { b.innerHTML = shown ? EYE_OFF : EYE_ON; b.setAttribute('aria-label', t(shown ? 'hide_pw' : 'show_pw')); b.setAttribute('aria-pressed', shown ? 'true' : 'false'); };
    set(false);
    b.addEventListener('click', e => { e.preventDefault(); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; set(show); i.focus({ preventScroll: true }); });
    w.appendChild(b);
  });
}
new MutationObserver(() => enhancePw()).observe(document.documentElement, { childList: true, subtree: true });

/* =====================================================================
   INIT
   ===================================================================== */
(async function init() {
  let lang = 'th'; try { lang = localStorage.getItem('clubbee.lang') || 'th'; } catch (e) {}
  I18N.set(lang); applyTheme();
  try { const q = new URLSearchParams(location.search).get('ref') || new URLSearchParams((location.hash.split('?')[1]) || '').get('ref'); if (q) sessionStorage.setItem('clubbee.ref', q.toUpperCase()); } catch (e) {}
  try { const link = document.createElement('link'); link.rel = 'icon'; link.type = 'image/svg+xml'; link.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(Brand.mark(64, 'light')); document.head.appendChild(link); const ai = document.createElement('link'); ai.rel = 'apple-touch-icon'; ai.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(Brand.appIcon(180)); document.head.appendChild(ai); } catch (e) {}
  DB.load();
  if (Cloud.on) {
    root().innerHTML = `<div class="center" style="padding-top:30vh">${Brand.appIcon(84)}<p class="muted" style="margin-top:14px">${t('loading')}</p></div>`;
    try { await Cloud.init(); }
    catch (e) { console.error(e); root().innerHTML = `<main class="container" style="max-width:460px;padding-top:18vh"><div class="center">${Brand.appIcon(72)}</div><h2 style="margin-top:14px">${t('cloud_error')}</h2><p class="muted small">${esc(e.message || e)}</p><button class="btn btn-honey" onclick="location.reload()">↻</button></main>`; return; }
  } else {
    Session.load();
    if (Session.s.userId && !Session.user) { Session.s.userId = null; Session.save(); }
    if (Session.s.adminId && !Session.admin) { Session.s.adminId = null; Session.save(); }
    if (Session.user) DB.update('users', Session.user.id, { online: true, last_active: now() });
  }
  window.addEventListener('hashchange', () => { closeSheet(); $('#match-ov')?.remove(); Router.render(); if (!location.hash.startsWith('#/app/chat/')) window.scrollTo(0, 0); });
  Router.render();
  setInterval(() => { if (Session.user && !$('#sheet-ov') && !document.activeElement?.matches('input,textarea,select')) UI.refreshBadges(); }, 30000);
})();
</script>
